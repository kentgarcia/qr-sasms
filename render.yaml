services:
  - type: web
    runtime: node
    name: stars
    plan: free
    buildCommand: npm ci && npx prisma migrate deploy && npm run bootstrap:admin && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.18.1
      - key: DATABASE_URL
        fromDatabase:
          name: stars-db
          property: connectionString
      # Semantic FAQ matching needs pgvector on the database
      # (Render Postgres: run CREATE EXTENSION IF NOT EXISTS vector; once).
      # Without Ollama these stay unset and the chatbot runs in keyword mode.
      - key: OLLAMA_BASE_URL
        sync: false
      - key: ASSISTANT_EMBED_MODEL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: BOOTSTRAP_SUPER_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_SUPER_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_SUPER_ADMIN_NAME
        value: SSO Admin

databases:
  - name: stars-db
    plan: free
    databaseName: stars
    user: stars
